[project]
name = "multi-agent"
version = "0.1.0"
description = "多 Agent 系统：deepagents 主线 + LangGraph 演进预留，OpenSandbox 云端沙箱，FastAPI 流式后端"
requires-python = ">=3.11"
dependencies = [
    # ── Web 层 ──
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.0",           # SSE 流式输出（/api/chat/stream）

    # ── Agent 层 ──
    "langgraph>=1.0",               # 图运行时底座（实际 1.2.10；0.2 过旧）
    "langgraph-checkpoint==4.1.1",  # Checkpointer 断点持久化（P0 锁版，计划文档 C.4-1）
    "langgraph-checkpoint-sqlite==3.1.0",  # SQLite saver（async 路径必需 AsyncSqliteSaver）
    "langchain>=1.0",               # 实际 1.3.14
    "langchain-core>=1.0",          # 实际 1.5.3（messages/middleware 1.x 契约）
    "langchain-openai>=1.0",        # 实际 1.4.1（DeepSeek/豆包/智谱 OpenAI 兼容协议）
    "deepagents>=0.7",              # 主 harness（实际 0.7.4：HITL/Rubric/声明式子代理）；更正：PyPI 包名是 deepagents

    # ── MCP 网关层 ──
    "fastmcp>=2.0",                 # MCP server（实际 3.4.5）
    "langchain-mcp-adapters>=0.3.1", # MCP client：MultiServerMCPClient 连接外部 server

    # ── 沙箱层（云端 OpenSandbox）──
    "opensandbox>=0.1",             # OpenSandbox 官方 Python SDK（连云端，本地不部署）

    # ── 记忆/存储 ──
    "redis>=5.0",                   # 短期记忆 + 成本缓存 redis 后端（实际 8.1.0）
    "aiosqlite>=0.20",              # SQLite 异步访问（长期记忆，实际 0.22.1）

    # ── 基建 ──
    "pydantic>=2.8",
    "pydantic-settings>=2.4",       # .env 配置中心（多 provider）
    "httpx>=0.27",                  # 搜索/抓取工具 + 容错重试（实际 0.28.1）
    "pyyaml>=6.0",                  # 声明式子 Agent YAML 配置

    # 已移除（2026-08-05 最小集审计，与 requirements.txt 对齐）：
    # - langsmith：src 无直接 import（tracing 由 langchain 传递依赖提供）
    # - python-dotenv：src 无直接 import（pydantic-settings 传递依赖处理 .env）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
