[project]
name = "multi-agent"
version = "0.1.0"
description = "多 Agent 系统：deepagents 主线 + LangGraph 演进预留，OpenSandbox 云端沙箱，FastAPI 流式后端"
requires-python = ">=3.11"
dependencies = [
    # ── Web 层 ──
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.0",           # SSE 流式输出（/api/chat/stream）

    # ── Agent 层 ──
    "langgraph>=0.2",               # 图运行时底座
    "langgraph-checkpoint-sqlite>=2.0",  # Checkpointer 持久化（SQLite）
    "langchain>=0.3",
    "langchain-openai>=0.2",        # DeepSeek/豆包/智谱均走 OpenAI 兼容协议
    "langchain-deepagents>=0.5",    # 主 harness（声明式子 Agent + write_todos + SKILL.md）

    # ── MCP 网关层 ──
    "fastmcp>=2.0",                 # MCP server（工具网关）

    # ── 沙箱层（云端 OpenSandbox）──
    "opensandbox>=0.1",             # OpenSandbox 官方 Python SDK（连云端，本地不部署）

    # ── 记忆/存储 ──
    "redis>=5.0",                   # 短期记忆（云端 Redis）
    "aiosqlite>=0.20",              # SQLite 异步访问（长期记忆）

    # ── 基建 ──
    "pydantic>=2.8",
    "pydantic-settings>=2.4",       # .env 配置中心（多 provider）
    "httpx>=0.27",                  # MCP HTTP 客户端（连接池/超时）
    "langsmith>=0.1",               # 监控 trace + eval
    "python-dotenv>=1.0",           # .env.dev / .env.prod 加载
    "pyyaml>=6.0",                  # 声明式子 Agent YAML 配置
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
